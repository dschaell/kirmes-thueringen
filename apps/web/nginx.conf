# Client-Tier: statische Auslieferung mit Sicherheits-Headern (OWASP A05)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self' mailto:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  # HSTS setzt der TLS-terminierende Reverse-Proxy in Produktion.

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
  # Nur `expires` statt add_header: sonst würden die Sicherheits-Header des server-Blocks verworfen.
  location /_astro/ {
    expires max;
  }
  location = /kalender.ics { default_type text/calendar; }
  error_page 404 /404.html;
}
