# Security & Quality Gates für den Kirmeskalender Thüringen.
# Jeder Job ist ein eigenes Gate; der Merge in main ist nur möglich, wenn "Quality Gate" grün ist
# (Branch Protection, siehe scripts/setup-github.sh).
#
# Alle Actions sind auf Commit-SHAs gepinnt (Supply-Chain-Schutz); Dependabot hält sie aktuell.
name: Security & Quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # wöchentlich: neue CVEs in unveränderten Abhängigkeiten finden
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0
  # v2.6.0, per Digest festgenagelt
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
  POSTGIS_IMAGE: postgis/postgis:17-3.5-alpine

jobs:
  # ──────────────────────────────────────────────────────────────── Secrets
  secrets:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: TruffleHog (gesamte History, auch unverifizierte Treffer)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # --fail setzt die Action selbst; verified + unknown = auch unbestätigte Treffer brechen ab
          extra_args: --results=verified,unknown

  # ──────────────────────────────────────────────────────────────── Lint & Types
  lint:
    name: Lint, Format, Typen, Schichtenregeln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: ESLint + Prettier + dependency-cruiser (Clean-Architecture-Grenzen)
        run: npm run lint
      - name: TypeScript
        run: npx tsc -b apps/api
      - name: Build (Core, API, Web)
        run: npm run build

  # ──────────────────────────────────────────────────────────────── Tests & Coverage
  test:
    name: Tests & Coverage-Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: kirmes
          POSTGRES_USER: kirmes
          POSTGRES_PASSWORD: ci_only_not_secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kirmes -d kirmes" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://kirmes:ci_only_not_secret@localhost:5432/kirmes
      # Der Service-Container existiert nur für die Tests
      TEST_DATABASE_URL: postgres://kirmes:ci_only_not_secret@localhost:5432/kirmes
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build -w @kirmes/core
      - run: npm run db:migrate && npm run db:orte && npm run db:beispiele
      - name: Unit- und Integrationstests mit Mindestabdeckung (vitest thresholds)
        run: npm run test:coverage
      - name: Coverage-Ratchet – Abdeckung darf gegenüber dem Basis-Branch nicht sinken
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp coverage/coverage-summary.json /tmp/pr-coverage.json
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add /tmp/base "$BASE_SHA"
          if [ -f /tmp/base/vitest.config.ts ]; then
            # Basis-Tests gegen eine EIGENE Datenbank mit dem Schema des Basis-Stands – die
            # Test-Datenbank ist schon mit den Migrationen dieses PRs migriert.
            psql "$DATABASE_URL" -c 'DROP DATABASE IF EXISTS kirmes_base' -c 'CREATE DATABASE kirmes_base'
            export DATABASE_URL="${DATABASE_URL%/*}/kirmes_base" TEST_DATABASE_URL="${DATABASE_URL%/*}/kirmes_base"
            (cd /tmp/base && npm ci && npm run build -w @kirmes/core \
              && npm run db:migrate && npm run db:orte && npm run db:beispiele \
              && npx vitest run --coverage --coverage.reporter=json-summary --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0)
            node scripts/coverage-ratchet.mjs /tmp/base/coverage/coverage-summary.json /tmp/pr-coverage.json
          else
            echo "Basis-Branch hat noch keine Tests – Ratchet übersprungen."
          fi
      - name: Upgrade-Test – ein Update darf Zugänge und Daten nicht verändern (Issue #59)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/upgrade-test.mjs "$BASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14 }

  # ──────────────────────────────────────────────────────────────── SAST
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF ins GitHub Security-Tab
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Eigene Regeln testen (SQL-Injection / pg)
        run: docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep --test --config .semgrep/sql-injection-pg.yml .semgrep/sql-injection-pg.ts
      - name: Semgrep Vollscan
        # Hinweis: "p/security-policy" existiert nicht in der Semgrep-Registry (404).
        # Abgedeckt durch security-audit + sql-injection + owasp-top-ten + eigene pg-Regeln.
        # Gate: WARNING (≈ Medium) und ERROR (≈ High) lassen den Build fehlschlagen.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/security-audit \
            --config p/sql-injection \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/nodejs \
            --config .semgrep/sql-injection-pg.yml \
            --exclude .semgrep \
            --severity WARNING --severity ERROR \
            --metrics off \
            --sarif-output semgrep.sarif \
            --error
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('semgrep.sarif') != ''
        with: { sarif_file: semgrep.sarif, category: semgrep }

  # ──────────────────────────────────────────────────────────────── SCA
  sca:
    name: SCA (npm audit + OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: npm audit – Laufzeit-Abhängigkeiten ab Moderate
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit – Entwicklungs-Abhängigkeiten ab High
        run: npm audit --audit-level=high
      # OSV-Scanner (Google) gleicht package-lock.json mit osv.dev ab – dort laufen GitHub-Advisories,
      # npm-Meldungen und NVD zusammen. Kein API-Schlüssel, keine stundenlange NVD-Synchronisation.
      # Jeder bekannte Fund bricht ab; begründete Ausnahmen gehören in osv-scanner.toml.
      - name: OSV-Scanner (jede bekannte Schwachstelle bricht ab)
        run: |
          mkdir -p reports
          set +e
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/reports:/report" "$OSV_SCANNER_IMAGE" \
            scan source --lockfile /src/package-lock.json --format sarif --output /report/osv.sarif
          code=$?
          set -e
          docker run --rm -v "$PWD:/src:ro" "$OSV_SCANNER_IMAGE" \
            scan source --lockfile /src/package-lock.json --format table || true
          exit $code
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('reports/osv.sarif') != ''
        with: { sarif_file: reports/osv.sarif, category: osv-scanner }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: osv-scanner, path: reports/, retention-days: 14 }

  # ──────────────────────────────────────────────────────────────── DAST
  dast:
    name: DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Stack starten (PostGIS + API + Web) mit Beispieldaten
        env:
          POSTGRES_PASSWORD: ci_only_not_secret
        run: |
          # ZAP crawlt schnell von einer IP – das Website-Rate-Limit würde sonst den Scan drosseln
          RATE_LIMIT_MAX=100000 docker compose --profile app up -d --build --wait
          docker compose --profile app run --rm migrate node apps/api/dist/infrastructure/postgres/orte.js
          docker compose --profile app run --rm migrate node apps/api/dist/infrastructure/postgres/beispiele.js
      - name: ZAP Baseline – Web (Client-Tier)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk/config:ro" -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 -c config/rules.tsv -J web.json -r web.html -I
      - name: ZAP Baseline – API (Server-Tier)
        run: |
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk/config:ro" -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "http://localhost:3100/api/v1/termine?landkreis=GTH" -c config/rules.tsv -J api.json -r api.html -I
      - name: Gate – keine Alerts mit Risiko Medium oder High
        run: node scripts/zap-gate.mjs zap/web.json zap/api.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: zap-reports, path: zap/, retention-days: 14 }
      - name: Logs bei Fehler
        if: failure()
        run: docker compose --profile app logs --no-color | tail -200

  # ──────────────────────────────────────────────────────────────── Gate
  gate:
    name: Quality Gate
    if: always()
    needs: [secrets, lint, test, sast, sca, dast]
    runs-on: ubuntu-latest
    steps:
      - name: Alle Gates bestanden?
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then exit 1; fi
